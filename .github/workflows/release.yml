name: 북한군 보병 WebP v1.2.8 릴리스
on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: east-asia-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check requested version and immutable release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json; assert json.load(open('release-request.json'))['version'] == json.load(open('package.json'))['version'] == '1.2.8'"
          if gh release view v1.2.8 >/dev/null 2>&1; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-shapely python3-numpy python3-pil
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify exact uploaded PNG and WebP files
        run: |
          python3 tools/east-asia/measure_unit_art.py
          python3 tools/east-asia/verify_city_art.py
          git diff --exit-code -- game/assets/east-asia-unit-bounds.js
      - name: Verify game and native shell
        run: |
          python3 tools/prepare_operation_music.py
          npm test
          node qa/east-asia-atlas.cjs
          node qa/east-asia-browser.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed update APK
        run: |
          python3 build.py
          python3 qa/east-asia-apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: East-Asia-Conquest-v128-checks
          path: |
            qa/east-asia-previews/*
            deliverables/*
          if-no-files-found: ignore
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release create v1.2.8 deliverables/East-Asia-Conquest-v1.2.8.apk deliverables/SHA256SUMS.txt --target "$SOURCE_SHA" --title '동아시아 콘퀘스트 v1.2.8 — 북한군 보병 WebP' --notes-file docs/releases/v1.2.8.md
