name: Hull-calibrated tanks and APK v1.2.1
on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: east-asia-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed source and original user artwork
        run: |
          python3 - <<'PYCODE'
          import pathlib,base64,tarfile,io,hashlib,json
          parts=sorted(pathlib.Path('.release-staging').glob('*.b64'))
          if parts:
            raw=base64.b64decode(''.join(p.read_text() for p in parts))
            expected=json.loads(pathlib.Path('release-request.json').read_text())['source_sha256']
            assert hashlib.sha256(raw).hexdigest()==expected
            with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              archive.extractall('.',filter='data')
            for p in parts:p.unlink()
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-shapely python3-numpy python3-pil
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Restore the exact original terrain materials
        if: ${{ hashFiles('art/terrain-materials/terrain-materials.png') == '' }}
        run: |
          git clone --no-checkout https://github.com/kminj0224/terha-conquest.git /tmp/terha-upstream
          git -C /tmp/terha-upstream checkout 4c968ba6d5d8a0397038de58612548341df48f8d
          mkdir -p art
          cp -a /tmp/terha-upstream/art/terrain-materials art/
      - name: Bake the new geography through the original Terha pipeline
        run: |
          if ! node qa/east-asia-atlas.cjs; then
            python3 tools/east-asia/generate_map.py
            node tools/east-asia/export_geography.cjs
            node tools/bake-aligned-map.cjs
            node tools/build-map-lods.cjs
            node tools/east-asia/render_assets.cjs
          fi
          python3 tools/prepare_operation_music.py
      - name: Verify geography, original renderer and real browser behavior
        run: |
          python3 tools/east-asia/measure_unit_art.py
          npm test
          node qa/east-asia-atlas.cjs
          node qa/east-asia-browser.cjs
          python3 qa/verify-native.py
      - name: Build and verify the signed update APK
        run: |
          python3 build.py
          python3 qa/east-asia-apk.py
      - name: Commit exact verified source and artwork
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game art tools audio qa data docs package.json package-lock.json build.py .gitignore AGENTS.md README.md
          git add -u .release-staging || true
          if ! git diff --cached --quiet; then
            git commit -m 'Replace tank artwork and calibrate actual hull size to native hex geometry'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: East-Asia-Conquest-v121-checks
          path: |
            qa/east-asia-previews/*
            docs/map-report.json
            deliverables/*
          if-no-files-found: ignore
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ! gh release view v1.2.1 >/dev/null 2>&1; then
            gh release create v1.2.1 deliverables/East-Asia-Conquest-v1.2.1.apk deliverables/SHA256SUMS.txt qa/east-asia-previews/korea-game.png qa/east-asia-previews/east-asia-overview.png qa/east-asia-previews/unit-art.png qa/east-asia-previews/tank-fit.png qa/east-asia-previews/unit-art-game.png qa/east-asia-previews/unit-art-attack.png qa/east-asia-previews/unit-art-impact.png --target "$SOURCE_SHA" --title '동아시아 콘퀘스트 v1.2.1 — 새 전차 이미지와 차체 기준 크기 보정' --notes-file docs/releases/v1.2.1.md
          fi
