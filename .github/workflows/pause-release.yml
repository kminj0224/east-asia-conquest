name: Pause v1.2.7 publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/pause-release.yml]
permissions:
  contents: read
concurrency:
  group: east-asia-release
  cancel-in-progress: true
jobs:
  pause:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Release paused because native WebP generation requirement is not fulfilled.'
